    <title>Snake</title>

<style>

  html {
    background: black;
    color: white;
    margin: 0;
    padding: 0;
  }

  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* ── Game card (the Gameboy disk frame) ── */
  .diskcontent {
    background-image: url(../object/gameboydisk.png);
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: relative;

    /* Fixed size on desktop */
    width: 1000px;
    height: 600px;

    /* Centred with breathing room */
    margin: 20px auto;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* ── Title ── */
  .titre {
    border: 0 solid #ccc;
    background: rgba(172, 255, 47, 0.692);
    width: 400px;
    margin: 0 auto;
    border-radius: 20px;
    text-align: center;
    padding: 4px 0;
    /* On desktop keep the original top margin via the flex gap above */
  }

  h1 {
    text-align: center;
    margin: 0;
  }

  /* ── School logo ── */
  .image {
    height: 100px;
    display: block;
    margin: 0 auto;
  }

  /* ── Text & labels ── */
  p {
    display: block;
    text-align: center;
    margin: 4px 0;
  }

  label {
    display: block;
    text-align: center;
    margin: 2px 0;
  }

  /* ── Inputs ── */
  input[type="text"],
  input[type="email"] {
    display: block;
    margin: 4px auto;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #888;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    font-size: 0.95rem;
    width: min(260px, 80vw);
  }

  input[type="text"]::placeholder,
  input[type="email"]::placeholder {
    color: #aaa;
  }

  /* ── Play button ── */
  .centre {
    display: block;
    margin: 8px auto 0;
    border: 0;
    line-height: 2.5;
    padding: 0 20px;
    font-size: 1rem;
    text-align: center;
    color: #fff;
    text-shadow: 1px 1px 1px #000;
    border-radius: 10px;
    background-color: rgba(220, 0, 0, 1);
    background-image: linear-gradient(
      to top left,
      rgba(0, 0, 0, 0.2),
      rgba(0, 0, 0, 0.2) 30%,
      rgba(0, 0, 0, 0)
    );
    box-shadow:
      inset 2px 2px 3px rgba(255, 255, 255, 0.6),
      inset -2px -2px 3px rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }

  .centre:hover {
    background-color: rgba(255, 0, 0, 1);
  }

  .centre:active {
    box-shadow:
      inset -2px -2px 3px rgba(255, 255, 255, 0.6),
      inset 2px 2px 3px rgba(0, 0, 0, 0.6);
  }

  /* ══════════════════════════════════════════
     RESPONSIVE – phone / small screen
     The card scales down so the Gameboy image
     stays visible from "far away".
     ══════════════════════════════════════════ */
  @media (max-width: 700px) {
    body {
      align-items: flex-start;
    }

    .diskcontent {
      /* Scale the whole card proportionally so the
         background image is always fully visible */
      width: 100vw;
      height: 60vw;          /* keeps the ~1000:600 ≈ 5:3 ratio */
      min-height: 220px;
      margin: 10px auto;
      gap: 2px;

      /* Shrink everything inside proportionally */
      transform-origin: top center;
    }

    .titre {
      width: min(220px, 55vw);
      font-size: clamp(0.6rem, 3.5vw, 1rem);
      border-radius: 12px;
    }

    h1 {
      font-size: clamp(0.8rem, 4vw, 1.3rem);
    }

    .image {
      height: clamp(40px, 10vw, 70px);
    }

    p,
    label {
      font-size: clamp(0.55rem, 2.8vw, 0.85rem);
      margin: 1px 0;
    }

    input[type="text"],
    input[type="email"] {
      font-size: clamp(0.55rem, 2.8vw, 0.85rem);
      padding: 2px 8px;
      width: min(180px, 55vw);
      margin: 2px auto;
    }

    .centre {
      font-size: clamp(0.6rem, 3vw, 0.9rem);
      line-height: 2;
      padding: 0 14px;
      border-radius: 7px;
      margin-top: 4px;
    }
  }

  /* Extra-small phones (≤ 360 px) */
  @media (max-width: 360px) {
    .diskcontent {
      height: 65vw;
    }
  }
</style>
