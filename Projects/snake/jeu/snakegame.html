<style>
  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    background: black;

  .fondgameboy {
    background-image: url(/object/portable-retro-game-console-90s-260nw-2155515871.jpg);
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    border: 10px solid grey;
    border-radius: 150px;

    /* Desktop: original fixed size */
    width: 600px;
    height: 1000px;
    margin: 20px auto;

    /* Allow inner elements to scale */
    position: relative;
    overflow: hidden;
  }

    flex-direction: column;
  }

  .game-canvas {
    width: 100%;
    height: 100vw;
    max-width: 360px;
    max-height: 330px;
    margin: 120px auto 155px;
    border-radius: 5px;
    display: block;
  }

  /* ── Controls layout (flex, no table) ── */
  .controls-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .controls-bottom {
    display: flex;
    flex-direction: row;

    width: 100%;
  }

  /* ── Directional keys ── */
  .keys {

    text-align: center;
    width: 235px;
    height: 200px;
  }

  .keysplace {
    display: block;
    padding: 29.5px 29.5px 29.5px 42.5px;
  }

  .box {
    cursor: pointer;
    width: 30px;
    height: 30px;
    text-align: center;
    line-height: 25px;
    background: rgb(24, 23, 23);
    color: rgb(78, 78, 78);
    border-right: 5px solid #181616;
    border-bottom: 5px solid #131212;
    border-left: 5px solid #161515;
    border-top: 5px solid #161515;
    display: inline-table;
    transition: all 0.1s linear;
    user-select: none;
  }

  .box:active { background: #555; }

  /* Arrow chevrons */
  .chevron::before {
    border-style: solid;
    border-width: 4px 4px 0 0;
    content: "";
    display: inline-table;
    height: 10px;
    width: 10px;
    top: 40px;
    position: relative;
    transform: rotate(-45deg);
    margin-bottom: 5px;
  }
  .chevron.down::before  { transform: rotate(135deg);  top: -1px; }
  .chevron.right::before { transform: rotate(45deg);   top: 1.5px; left: -1px; }
  .chevron.left::before  { transform: rotate(225deg);  top: 1.5px; left: 1px; }
  .chevron.up::before    { top: 3px; }

  .color.middle::before { content: ""; position: relative; }
  .color::before {
    display: inline-table;
    cursor: pointer;
    text-align: center;
    height: 10px;
    line-height: 10px;
    width: 10px;
    background: rgb(77, 70, 70);
    transform: rotate(45deg);
  }

  /* ── Red buttons (A / B) ── */
  .redbut {
    width: 75px;
    height: 75px;
    background: rgb(197, 0, 0);
    border-radius: 70px;
    border: solid 2px #2c2b2b75;
    display: block;
    margin-top: 20px;
    cursor: pointer;
  }
  .redbut:active {
    background: #492222;
    border-color: #966969;
    box-shadow:
      rgba(0, 0, 218, 0.25) 0px 30px 60px -12px inset,
      rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
  }

  .Bbutton { margin-top: 10px; margin-left: 127px; }
  .Abutton { margin-bottom: 100px; margin-left: 10px; }

  /* ── Select / Start ── */
  .SelectBut {
    background-color: rgb(99, 99, 99);

    cursor: pointer;
    display: block;

  .SelectBut:hover { background-color: rgb(20, 20, 31); }

  .Startbut {
    background-color: rgb(99, 99, 99);
    height: 25px;
    width: 75px;
    border-radius: 13em / 3em;
    transform: rotate(330deg);
    border: 2px solid grey;

  .Startbut:hover { background-color: rgb(43, 39, 39); }


  /* ══════════════════════════════════════════
     RESPONSIVE — téléphone / vue de loin
     La console est mise à l'échelle via CSS
     transform pour garder les proportions
     du fond Gameboy intact.
     ══════════════════════════════════════════ */
  @media (max-width: 640px) {
    body {
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* Compute scale so the 600px shell fits the viewport */
    .fondgameboy {
      /*
       * On a 360 px phone : scale = 360/620 ≈ 0.58
       * We use a CSS custom property calculated from vw.
       * transform-origin top-center keeps it stuck to the top.
       */
      transform: scale(calc( (100vw - 20px) / 620 ));
      transform-origin: top center;

      /* The element still occupies its original 600×1000 space in the
         document flow, so we push the body height down accordingly.
         We compensate with a negative margin-bottom. */
      margin-top: 10px;
      margin-bottom: calc( (100vw - 20px) / 620 * 1000px - 1000px );
    }
  }

  /* Extra-small (≤ 360 px): same rule, just tighter margin-top */
  @media (max-width: 360px) {
    .fondgameboy {
      margin-top: 4px;
    }
  }

<script>
  function getRandomColor() {
    return (
      "#" + ("00000" + ((Math.random() * 16777216) << 0).toString(16)).substr(-6)
    );
  }

  var Snake = (function () {
    const INITIAL_TAIL = 2;
    var fixedTail = true;
    var intervalID;
    var tileCount = 10;
    var gridSize = 400 / tileCount;
    const INITIAL_PLAYER = {
      x: Math.floor(tileCount / 2),
      y: Math.floor(tileCount / 2),
    };

    var velocity = { x: 0, y: 0 };
    var player = { x: INITIAL_PLAYER.x, y: INITIAL_PLAYER.y };

    var walls = false;
    var fruit = { x: 1, y: 1 };

    var trail = [];
    var tail = INITIAL_TAIL;

    var reward = 0;
    var points = 0;
    var pointsMax = 0;

    var ActionEnum = { none: 0, up: 1, down: 2, left: 3, right: 4 };
    Object.freeze(ActionEnum);
    var lastAction = ActionEnum.none;
    let color = getRandomColor();
    let color2 = getRandomColor();

    var canv, ctx;

    function setup() {
      canv = document.getElementById("gc");
      ctx = canv.getContext("2d");
      game.reset();
    }

    var game = {
      reset: function () {
        ctx.fillStyle = "grey";
        ctx.fillRect(0, 0, canv.width, canv.height);
        tail = INITIAL_TAIL;
        points = 0;
        velocity.x = 0;
        velocity.y = 0;
        player.x = INITIAL_PLAYER.x;
        player.y = INITIAL_PLAYER.y;
        reward = -1;
        lastAction = ActionEnum.none;
        trail = [];
        trail.push({ x: player.x, y: player.y });
      },

      action: {
        up:    function () { if (lastAction !== ActionEnum.down)  { velocity.x = 0; velocity.y = -1; } },
        down:  function () { if (lastAction !== ActionEnum.up)    { velocity.x = 0; velocity.y =  1; } },
        left:  function () { if (lastAction !== ActionEnum.right) { velocity.x = -1; velocity.y = 0; } },
        right: function () { if (lastAction !== ActionEnum.left)  { velocity.x =  1; velocity.y = 0; } },
      },

      RandomFruit: function () {
        if (walls) {
          fruit.x = 1 + Math.floor(Math.random() * (tileCount - 2));
          fruit.y = 1 + Math.floor(Math.random() * (tileCount - 2));
        } else {
          fruit.x = Math.floor(Math.random() * tileCount);
          fruit.y = Math.floor(Math.random() * tileCount);
        }
      },

      loop: function () {
        reward = -0.1;

        function DontHitWall() {
          if (player.x < 0) player.x = tileCount - 1;
          if (player.x >= tileCount) player.x = 0;
          if (player.y < 0) player.y = tileCount - 1;
          if (player.y >= tileCount) player.y = 0;
        }

        function HitWall() {
          if (player.x < 1) game.reset();
          if (player.x > tileCount - 2) game.reset();
          if (player.y < 1) game.reset();
          if (player.y > tileCount - 2) game.reset();
          ctx.fillStyle = "green";
          ctx.fillRect(0, 0, gridSize - 1, canv.height);
          ctx.fillRect(0, 0, canv.width, gridSize - 1);
          ctx.fillRect(canv.width - gridSize + 1, 0, gridSize, canv.height);
          ctx.fillRect(0, canv.height - gridSize + 1, canv.width, gridSize);
        }

        var stopped = velocity.x === 0 && velocity.y === 0;

        player.x += velocity.x;
        player.y += velocity.y;

        if (velocity.x === 0 && velocity.y === -1) lastAction = ActionEnum.up;
        if (velocity.x === 0 && velocity.y ===  1) lastAction = ActionEnum.down;
        if (velocity.x === -1 && velocity.y === 0) lastAction = ActionEnum.left;
        if (velocity.x ===  1 && velocity.y === 0) lastAction = ActionEnum.right;

        ctx.fillStyle = "rgba(107, 167, 101, 0.51)";
        ctx.fillRect(0, 0, canv.width, canv.height);

        if (walls) HitWall();
        else DontHitWall();

        if (!stopped) {
          trail.push({ x: player.x, y: player.y });
          while (trail.length > tail) trail.shift();
        }

        if (!stopped) {
          ctx.fillStyle = "rgba(165, 203, 104, 1)";
          ctx.font = "small-caps 14px Helvetica";
          ctx.fillText("(esc) reset", 24, 356);
          ctx.fillText("(space) pause", 24, 374);
        }

        ctx.fillStyle = color;
        for (var i = 0; i < trail.length - 1; i++) {
          ctx.fillRect(
            trail[i].x * gridSize + 1,
            trail[i].y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
          );
          if (!stopped && trail[i].x === player.x && trail[i].y === player.y) {
            game.reset();
          }
          ctx.fillStyle = color;
        }
        ctx.fillRect(
          trail[trail.length - 1].x * gridSize + 1,
          trail[trail.length - 1].y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );

        if (player.x === fruit.x && player.y === fruit.y) {
          if (!fixedTail) tail++;
          points++;
          if (points > pointsMax) pointsMax = points;
          reward = 1;
          game.RandomFruit();
          while (
            (function () {
              for (var i = 0; i < trail.length; i++) {
                if (trail[i].x === fruit.x && trail[i].y === fruit.y) {
                  game.RandomFruit();
                  return true;
                }
              }
              return false;
            })()
          );
        }

        ctx.fillStyle = color2;
        ctx.fillRect(
          fruit.x * gridSize + 1,
          fruit.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );

        if (stopped) {
          ctx.fillStyle = "rgba(165, 203, 104, 1)";
          ctx.font = "small-caps bold 14px Helvetica";
          ctx.fillText("press ARROW KEYS to START...", 24, 374);
        }

        ctx.fillStyle = "white";
        ctx.font = "bold small-caps 16px Helvetica";
        ctx.fillText("points: " + points, 288, 40);
        ctx.fillText("top: " + pointsMax, 292, 60);

        return reward;
      },
    };

    function keyPush(evt) {
      switch (evt.keyCode) {
        case 37: game.action.left();  evt.preventDefault(); break;
        case 38: game.action.up();    evt.preventDefault(); break;
        case 39: game.action.right(); evt.preventDefault(); break;
        case 40: game.action.down();  evt.preventDefault(); break;
        case 32: Snake.pause();       evt.preventDefault(); break;
        case 27: game.reset();        evt.preventDefault(); break;
      }
    }

    return {
      start: function (fps = 15) {
        window.onload = setup;
        intervalID = setInterval(game.loop, 1000 / fps);
      },

      loop:  game.loop,
      reset: game.reset,
      stop:  function () {},

      setup: {
        keyboard: function (state) {
          if (state) document.addEventListener("keydown", keyPush);
          else       document.removeEventListener("keydown", keyPush);
        },
        wall: function (state) { walls = state; },
        tileCount: function (size) {
          tileCount = size;
          gridSize = 400 / tileCount;
        },
        fixedTail: function (state) { fixedTail = state; },
      },

      action: function (act) {
        switch (act) {
          case "left":  game.action.left();  break;
          case "up":    game.action.up();    break;
          case "right": game.action.right(); break;
          case "down":  game.action.down();  break;
        }
      },

      pause: function () { velocity.x = 0; velocity.y = 0; },

      clearTopScore: function () { pointsMax = 0; },

      data: {
        player: player,
        fruit:  fruit,
        trail:  function () { return trail; },
      },

      info: { tileCount: tileCount },

      startbut: function () { color  = getRandomColor(); },
      middlebut: function () { color2 = getRandomColor(); },
    };
  })();

  /* ── Initialisation ── */
  window.addEventListener("load", function () {
    Snake.start(8);
    Snake.setup.keyboard(true);
    Snake.setup.fixedTail(false);
  });
</script>
