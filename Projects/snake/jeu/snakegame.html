<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="color-scheme" content="dark light" />

  <title>Snake Game</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* =========================================
       GAMEBOY
    ========================================= */

    .fondgameboy {

      position: relative;

      width: min(600px, 100vw);
      aspect-ratio: 600 / 1000;

      margin-top: 20px;

      border: 10px solid grey;
      border-radius: 40px;

      background-image: url("../object/portable-retro-game-console-90s-260nw-2155515871.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;

      overflow: hidden;
    }

    /* =========================================
       SCREEN
    ========================================= */

    #game-container {
      display: flex;
      justify-content: center;
    }

    .game-canvas {

      display: block;

      width: 60%;
      aspect-ratio: 1 / 1;

      margin-top: 20%;
      margin-bottom: 26%;

      border-radius: 5px;
    }

    /* =========================================
       BUTTONS
    ========================================= */

    .redbut {

      width: 75px;
      height: 75px;

      background: rgb(197, 0, 0);

      border-radius: 50%;
      border: 4px solid #2c2b2b75;

      display: block;

      cursor: pointer;
    }

    .redbut:active {

      background: #492222;

      border-color: #966969;

      box-shadow:
        rgba(0, 0, 218, 0.25) 0px 30px 60px -12px inset,
        rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
    }

    /* =========================================
       DPAD
    ========================================= */

    .keys {

      width: 235px;
      height: 200px;

      text-align: center;
    }

    .keysplace {

      display: block;

      padding-top: 29px;
      padding-left: 42px;
    }

    .box {

      cursor: pointer;

      width: 30px;
      height: 30px;

      text-align: center;
      line-height: 25px;

      background: rgb(24, 23, 23);

      border-right: 5px solid #181616;
      border-bottom: 5px solid #131212;
      border-left: 5px solid #161515;
      border-top: 5px solid #161515;

      display: inline-table;

      transition: 0.1s linear;

      user-select: none;
    }

    .box:active {
      background: #555;
    }

    /* =========================================
       ARROWS
    ========================================= */

    .chevron::before {

      border-style: solid;
      border-width: 4px 4px 0 0;

      content: "";

      display: inline-table;

      height: 10px;
      width: 10px;

      position: relative;

      transform: rotate(-45deg);

      margin-bottom: 5px;
    }

    .chevron.down::before {
      transform: rotate(135deg);
      top: -1px;
    }

    .chevron.right::before {
      transform: rotate(45deg);
      top: 1px;
      left: -1px;
    }

    .chevron.left::before {
      transform: rotate(225deg);
      top: 1px;
      left: 1px;
    }

    .chevron.up::before {
      top: 3px;
    }

    /* =========================================
       CENTER BUTTON
    ========================================= */

    .color.middle::before {
      content: "";
      position: relative;
    }

    .color::before {

      display: inline-table;

      height: 10px;
      width: 10px;

      background: rgb(77, 70, 70);

      transform: rotate(45deg);
    }

    /* =========================================
       ACTION BUTTONS
    ========================================= */

    .Bbutton {
      margin-top: 10px;
      margin-left: 127px;
    }

    .Abutton {
      margin-bottom: 100px;
      margin-left: 10px;
    }

    /* =========================================
       START / SELECT
    ========================================= */

    .SelectBut,
    .Startbut {

      background-color: rgb(99, 99, 99);

      height: 25px;
      width: 75px;

      border-radius: 13em / 3em;

      border: 2px solid grey;

      cursor: pointer;

      display: block;
    }

    .SelectBut {

      margin-left: 175px;
      margin-top: 15px;

      transform: rotate(335deg);
    }

    .Startbut {

      transform: rotate(330deg);

      margin-top: 10px;
      margin-left: 29px;
    }

    .SelectBut:hover {
      background-color: rgb(20, 20, 31);
    }

    .Startbut:hover {
      background-color: rgb(43, 39, 39);
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 640px) {

      .fondgameboy {

        width: 100vw;

        border-width: 6px;

        border-radius: 30px;

        margin-top: 0;
      }

      .redbut {

        width: 60px;
        height: 60px;
      }

      .keys {
        width: 160px;
      }

      .Bbutton {
        margin-left: 70px;
      }

      .Abutton {
        margin-left: 0;
      }

      .SelectBut {
        margin-left: 120px;
      }
    }

  </style>
</head>

<body>

  <div class="fondgameboy">

    <div id="game-container">
      <canvas
        id="gc"
        class="game-canvas"
        width="400"
        height="400"
      ></canvas>
    </div>

    <table>

      <thead>

        <td>

          <div class="keys">

            <table class="keysplace">

              <thead>
                <td>
                  <a class="up box" onclick="Snake.action('up')">
                    <i class="chevron up"></i>
                  </a>
                </td>
              </thead>

              <tbody>
                <td>

                  <a class="left box" onclick="Snake.action('left')">
                    <i class="chevron left"></i>
                  </a>

                  <a class="middle box" onclick="Snake.middlebut()">
                    <i class="color middle"></i>
                  </a>

                  <a class="right box" onclick="Snake.action('right')">
                    <i class="chevron right"></i>
                  </a>

                </td>
              </tbody>

              <tfoot>
                <td>
                  <a class="down box" onclick="Snake.action('down')">
                    <i class="chevron down"></i>
                  </a>
                </td>
              </tfoot>

            </table>

          </div>

        </td>

        <td>

          <div class="Bbutton">

            <a onclick="Snake.pause()">
              <i class="redbut"></i>
            </a>

          </div>

        </td>

        <td>

          <div class="Abutton">

            <a onclick="Snake.reset()">
              <i class="redbut"></i>
            </a>

          </div>

        </td>

      </thead>

      <tbody>

        <td>

          <a href="../enregistrement/snake.html">
            <i class="SelectBut"></i>
          </a>

        </td>

        <td>

          <a onclick="Snake.startbut()">
            <i class="Startbut"></i>
          </a>

        </td>

      </tbody>

    </table>

  </div>

  <script>

    function getRandomColor() {

      return (
        "#" +
        ("00000" + ((Math.random() * 16777216) << 0).toString(16)).substr(-6)
      );
    }

    var Snake = (function () {

      const INITIAL_TAIL = 2;

      var fixedTail = true;

      var tileCount = 10;

      var gridSize = 400 / tileCount;

      const INITIAL_PLAYER = {
        x: Math.floor(tileCount / 2),
        y: Math.floor(tileCount / 2),
      };

      var velocity = { x: 0, y: 0 };

      var player = {
        x: INITIAL_PLAYER.x,
        y: INITIAL_PLAYER.y,
      };

      var fruit = { x: 1, y: 1 };

      var trail = [];

      var tail = INITIAL_TAIL;

      var points = 0;

      var pointsMax = 0;

      var color = getRandomColor();

      var color2 = getRandomColor();

      var canv;
      var ctx;

      function setup() {

        canv = document.getElementById("gc");

        ctx = canv.getContext("2d");

        game.reset();
      }

      var game = {

        reset: function () {

          ctx.fillStyle = "grey";

          ctx.fillRect(0, 0, canv.width, canv.height);

          tail = INITIAL_TAIL;

          points = 0;

          velocity.x = 0;
          velocity.y = 0;

          player.x = INITIAL_PLAYER.x;
          player.y = INITIAL_PLAYER.y;

          trail = [];

          trail.push({
            x: player.x,
            y: player.y,
          });
        },

        action: {

          up: function () {
            velocity.x = 0;
            velocity.y = -1;
          },

          down: function () {
            velocity.x = 0;
            velocity.y = 1;
          },

          left: function () {
            velocity.x = -1;
            velocity.y = 0;
          },

          right: function () {
            velocity.x = 1;
            velocity.y = 0;
          },
        },

        RandomFruit: function () {

          fruit.x = Math.floor(Math.random() * tileCount);

          fruit.y = Math.floor(Math.random() * tileCount);
        },

        loop: function () {

          player.x += velocity.x;
          player.y += velocity.y;

          if (player.x < 0) player.x = tileCount - 1;
          if (player.x >= tileCount) player.x = 0;

          if (player.y < 0) player.y = tileCount - 1;
          if (player.y >= tileCount) player.y = 0;

          ctx.fillStyle = "rgba(107,167,101,0.51)";

          ctx.fillRect(0, 0, canv.width, canv.height);

          trail.push({
            x: player.x,
            y: player.y,
          });

          while (trail.length > tail) {
            trail.shift();
          }

          ctx.fillStyle = color;

          for (let i = 0; i < trail.length; i++) {

            ctx.fillRect(
              trail[i].x * gridSize + 1,
              trail[i].y * gridSize + 1,
              gridSize - 2,
              gridSize - 2
            );
          }

          if (player.x === fruit.x && player.y === fruit.y) {

            tail++;

            points++;

            if (points > pointsMax) {
              pointsMax = points;
            }

            game.RandomFruit();
          }

          ctx.fillStyle = color2;

          ctx.fillRect(
            fruit.x * gridSize + 1,
            fruit.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
          );

          ctx.fillStyle = "white";

          ctx.font = "bold 16px Arial";

          ctx.fillText("points: " + points, 260, 40);

          ctx.fillText("top: " + pointsMax, 280, 60);
        },
      };

      function keyPush(evt) {

        switch (evt.keyCode) {

          case 37:
            game.action.left();
            evt.preventDefault();
            break;

          case 38:
            game.action.up();
            evt.preventDefault();
            break;

          case 39:
            game.action.right();
            evt.preventDefault();
            break;

          case 40:
            game.action.down();
            evt.preventDefault();
            break;

          case 32:
            Snake.pause();
            evt.preventDefault();
            break;

          case 27:
            game.reset();
            evt.preventDefault();
            break;
        }
      }

      return {

        start: function (fps = 8) {

          window.onload = setup;

          setInterval(game.loop, 1000 / fps);
        },

        reset: game.reset,

        action: function (act) {
          game.action[act]();
        },

        pause: function () {

          velocity.x = 0;
          velocity.y = 0;
        },

        setup: {

          keyboard: function (state) {

            if (state) {
              document.addEventListener("keydown", keyPush);
            }
          },
        },

        startbut: function () {
          color = getRandomColor();
        },

        middlebut: function () {
          color2 = getRandomColor();
        },
      };

    })();

    Snake.start(8);

    Snake.setup.keyboard(true);

  </script>

</body>
</html>
