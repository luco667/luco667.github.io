<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=3"
  />

  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="../object/427533.ico" type="image/x-icon" />
  <link rel="next" href="../enregistrement/snake.html" />

  <title>Snake Game</title>

  <style>
    /* Remplace tout le contenu de ta balise <style> */
    :root {
      /* Unité responsive : 1px max, réduite selon la largeur ET la hauteur de l'écran.
        640 = largeur totale de la console (600 + 2×10 de bordure + marge)
        1060 = hauteur totale (1000 + 20 de bordure + 20 de marge + marge) */
      --u: min(1px, calc(100vw / 640), calc(100svh / 1060));
    }

    html {
      background: black;
    }

    body {
      margin: 0;
      min-height: 100svh;
    }

    .fondgameboy {
      background-image: url("../object/portable-retro-game-console-90s-260nw-2155515871.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      border: calc(10 * var(--u)) solid grey;
      width: calc(600 * var(--u));
      height: calc(1000 * var(--u));
      margin: calc(20 * var(--u)) auto 0;
      border-radius: calc(150 * var(--u));
    }

    #game-container {
      display: flex;
      flex-direction: column;
      width: calc(600 * var(--u));
    }

    .game-canvas {
      width: calc(360 * var(--u));
      height: calc(330 * var(--u));
      margin: calc(120 * var(--u)) auto calc(155 * var(--u));
      border-radius: calc(5 * var(--u));
    }

    /* Tableau de contrôles */
    table {
      border-spacing: calc(2 * var(--u));
    }

    td {
      padding: 0;
    }

    /* Croix directionnelle */
    .keys {
      width: calc(210 * var(--u));
      height: calc(200 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .keysplace {
      display: grid;
      grid-template-columns: repeat(3, calc(40 * var(--u)));
      grid-template-rows: repeat(3, calc(40 * var(--u)));
      gap: 0;
      padding: 0;
    }

    .box {
      width: calc(40 * var(--u));
      height: calc(40 * var(--u));
      background: rgb(24, 23, 23);
      border-right: calc(5 * var(--u)) solid #181616;
      border-bottom: calc(5 * var(--u)) solid #131212;
      border-left: calc(5 * var(--u)) solid #161515;
      border-top: calc(5 * var(--u)) solid #161515;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: all 0.1s linear;
    }

    .box:active {
      background: #555;
    }

    .up     { grid-column: 2; grid-row: 1; }
    .left   { grid-column: 1; grid-row: 2; }
    .middle { grid-column: 2; grid-row: 2; }
    .right  { grid-column: 3; grid-row: 2; }
    .down   { grid-column: 2; grid-row: 3; }

    .chevron::before {
      content: "";
      display: block;
      width: calc(10 * var(--u));
      height: calc(10 * var(--u));
      border-style: solid;
      border-width: calc(4 * var(--u)) calc(4 * var(--u)) 0 0;
    }

    .chevron.up::before    { transform: rotate(-45deg); }
    .chevron.right::before { transform: rotate(45deg); }
    .chevron.down::before  { transform: rotate(135deg); }
    .chevron.left::before  { transform: rotate(225deg); }

    .color::before {
      content: "";
      display: block;
      width: calc(12 * var(--u));
      height: calc(12 * var(--u));
      background: rgb(77, 70, 70);
      transform: rotate(45deg);
    }

    /* Boutons A / B */
    .redbut {
      width: calc(75 * var(--u));
      height: calc(75 * var(--u));
      background: rgb(197, 0, 0);
      border: calc(3 * var(--u)) solid #2c2b2b75;
      border-radius: 50%;
      display: block;
      margin-top: calc(20 * var(--u));
      cursor: pointer;
      box-sizing: content-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .redbut:active {
      background: #492222;
      border-color: #966969;
      box-shadow: rgba(0, 0, 218, 0.25) 0 calc(30 * var(--u)) calc(60 * var(--u)) calc(-12 * var(--u)) inset,
                  rgba(0, 0, 0, 0.3) 0 calc(18 * var(--u)) calc(36 * var(--u)) calc(-18 * var(--u)) inset;
    }

    .Bbutton {
      margin-top: calc(10 * var(--u));
      margin-left: calc(127 * var(--u));
    }

    .Abutton {
      margin-bottom: calc(100 * var(--u));
      margin-left: calc(10 * var(--u));
    }

    /* Select / Start */
    .SelectBut,
    .Startbut {
      background-color: rgb(99, 99, 99);
      height: calc(25 * var(--u));
      width: calc(75 * var(--u));
      border: calc(2 * var(--u)) solid grey;
      border-radius: 13em / 3em;
      cursor: pointer;
      display: block;
      box-sizing: content-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .SelectBut {
      margin-left: calc(175 * var(--u));
      margin-top: calc(15 * var(--u));
      transform: rotate(335deg);
    }

    .Startbut {
      margin-left: calc(29 * var(--u));
      margin-top: calc(10 * var(--u));
      transform: rotate(330deg);
    }

    .SelectBut:hover { background-color: rgb(20, 20, 31); }
    .Startbut:hover  { background-color: rgb(43, 39, 39); }
  </style>
</head>

<body>

  <div class="fondgameboy">

    <div id="game-container">
      <canvas
        id="gc"
        class="game-canvas"
        width="400"
        height="400"
      ></canvas>
    </div>

    <table>

      <thead>

        <td>

          <div class="keys">

            <div class="keysplace">

  <a class="up box" onclick="Snake.action('up')">
    <i class="chevron up"></i>
  </a>

  <a class="left box" onclick="Snake.action('left')">
    <i class="chevron left"></i>
  </a>

  <a class="middle box" onclick="Snake.middlebut()">
    <i class="color middle"></i>
  </a>

  <a class="right box" onclick="Snake.action('right')">
    <i class="chevron right"></i>
  </a>

  <a class="down box" onclick="Snake.action('down')">
    <i class="chevron down"></i>
  </a>

</div>

          </div>

        </td>

        <td>

          <div class="Bbutton">

            <a onclick="Snake.pause()">
              <i class="redbut"></i>
            </a>

          </div>

        </td>

        <td>

          <div class="Abutton">

            <a onclick="Snake.reset()">
              <i class="redbut"></i>
            </a>

          </div>

        </td>

      </thead>

      <tbody>

        <td>

          <a href="../enregistrement/snake.html">
            <i class="SelectBut"></i>
          </a>

        </td>

        <td>

          <a onclick="Snake.startbut()">
            <i class="Startbut"></i>
          </a>

        </td>

      </tbody>

    </table>

  </div>

<script>
  function getRandomColor() {
  return (
    "#" + ("00000" + ((Math.random() * 16777216) << 0).toString(16)).substr(-6)
  );
} /*create random color*/

var Snake /*create the snake game function*/ = (function () {
  const INITIAL_TAIL = 2; /*initializes the size of the start of the game for the snake*/
  var fixedTail = true; /*
  fix the tail to the head*/
  var intervalID; /*set up the time*/
  var tileCount = 10;/*set up the size of cases*/
  var gridSize = 400 / tileCount;/*set up the grid*/
  const INITIAL_PLAYER = {
    x: Math.floor(tileCount / 2),
    y: Math.floor(tileCount / 2),
  };/* set up the physique of players*/

  var velocity = { x: 0, y: 0 };/* set up the speed*/
  var player = { x: INITIAL_PLAYER.x, y: INITIAL_PLAYER.y };/*place the player*/

  var walls = false;/*make walls not solid*/
  var fruit = { x: 1, y: 1 };/*place the fruit on grid*/

  var trail = [];/* set up the trail*/
  var tail = INITIAL_TAIL;/* set up the first tail*/

  var reward = 0;
  var points = 0;
  var pointsMax = 0;

  var ActionEnum = { none: 0, up: 1, down: 2, left: 3, right: 4 };
  Object.freeze(ActionEnum);
  var lastAction = ActionEnum.none;
  let color = getRandomColor();
  let color2 = getRandomColor();

  function setup() {
    canv = document.getElementById("gc");
    ctx = canv.getContext("2d");

    game.reset();
  }

  var game = {
    reset: function () {
      ctx.fillStyle = "grey";
      ctx.fillRect(0, 0, canv.width, canv.height);

      tail = INITIAL_TAIL;
      points = 0;
      velocity.x = 0;
      velocity.y = 0;
      player.x = INITIAL_PLAYER.x;
      player.y = INITIAL_PLAYER.y;
      // this.RandomFruit();
      reward = -1;

      lastAction = ActionEnum.none;

      trail = [];
      trail.push({ x: player.x, y: player.y });
      // for(var i=0; i<tail; i++) trail.push({ x: player.x, y: player.y });
    },

    action: {
      up: function () {
        if (lastAction != ActionEnum.down) {
          velocity.x = 0;
          velocity.y = -1;
        }
      },
      down: function () {
        if (lastAction != ActionEnum.up) {
          velocity.x = 0;
          velocity.y = 1;
        }
      },
      left: function () {
        if (lastAction != ActionEnum.right) {
          velocity.x = -1;
          velocity.y = 0;
        }
      },
      right: function () {
        if (lastAction != ActionEnum.left) {
          velocity.x = 1;
          velocity.y = 0;
        }
      },
    },

    RandomFruit: function () {
      if (walls) {
        fruit.x = 1 + Math.floor(Math.random() * (tileCount - 2));
        fruit.y = 1 + Math.floor(Math.random() * (tileCount - 2));
      } else {
        fruit.x = Math.floor(Math.random() * tileCount);
        fruit.y = Math.floor(Math.random() * tileCount);
      }
    },

    log: function () {
      console.log("====================");
      console.log("x:" + player.x + ", y:" + player.y);
      console.log("tail:" + tail + ", trail.length:" + trail.length);
    },

    loop: function () {
      reward = -0.1;

      function DontHitWall() {
        if (player.x < 0) player.x = tileCount - 1;
        if (player.x >= tileCount) player.x = 0;
        if (player.y < 0) player.y = tileCount - 1;
        if (player.y >= tileCount) player.y = 0;
      }
      function HitWall() {
        if (player.x < 1) game.reset();
        if (player.x > tileCount - 2) game.reset();
        if (player.y < 1) game.reset();
        if (player.y > tileCount - 2) game.reset();

        ctx.fillStyle = "green";
        ctx.fillRect(0, 0, gridSize - 1, canv.height);
        ctx.fillRect(0, 0, canv.width, gridSize - 1);
        ctx.fillRect(canv.width - gridSize + 1, 0, gridSize, canv.height);
        ctx.fillRect(0, canv.height - gridSize + 1, canv.width, gridSize);
      }

      var stopped = velocity.x == 0 && velocity.y == 0;

      player.x += velocity.x;
      player.y += velocity.y;

      if (velocity.x == 0 && velocity.y == -1) lastAction = ActionEnum.up;
      if (velocity.x == 0 && velocity.y == 1) lastAction = ActionEnum.down;
      if (velocity.x == -1 && velocity.y == 0) lastAction = ActionEnum.left;
      if (velocity.x == 1 && velocity.y == 0) lastAction = ActionEnum.right;

      ctx.fillStyle = "rgba(107, 167, 101, 0.51)";
      ctx.fillRect(0, 0, canv.width, canv.height);

      if (walls) HitWall();
      else DontHitWall();

      // game.log();

      if (!stopped) {
        trail.push({ x: player.x, y: player.y });
        while (trail.length > tail) trail.shift();
      }

      if (!stopped) {
        ctx.fillStyle = "rgba(165, 203, 104, 1)";
        ctx.font = "small-caps 14px Helvetica";
        ctx.fillText("(esc) reset", 24, 356);
        ctx.fillText("(space) pause", 24, 374);
      }

      ctx.fillStyle = color; /* snake color */
      for (var i = 0; i < trail.length - 1; i++) {
        ctx.fillRect(
          trail[i].x * gridSize + 1,
          trail[i].y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );

        // console.debug(i + ' => player:' + player.x, player.y + ', trail:' + trail[i].x, trail[i].y);
        if (!stopped && trail[i].x == player.x && trail[i].y == player.y) {
          game.reset();
        }
        ctx.fillStyle = color; /* snake color queue */
      }
      ctx.fillRect(
        trail[trail.length - 1].x * gridSize + 1,
        trail[trail.length - 1].y * gridSize + 1,
        gridSize - 2,
        gridSize - 2
      );

      if (player.x == fruit.x && player.y == fruit.y) {
        if (!fixedTail) tail++;
        points++;
        if (points > pointsMax) pointsMax = points;
        reward = 1;
        game.RandomFruit();
        // make sure new fruit didn't spawn in snake tail
        while (
          (function () {
            for (var i = 0; i < trail.length; i++) {
              if (trail[i].x == fruit.x && trail[i].y == fruit.y) {
                game.RandomFruit();
                return true;
              }
            }
            return false;
          })()
        );
      }

      ctx.fillStyle = color2; /*faire une pomme*/
      ctx.fillRect(
        fruit.x * gridSize + 1,
        fruit.y * gridSize + 1,
        gridSize - 2,
        gridSize - 2
      );

      if (stopped) {
        ctx.fillStyle = "rgba(165, 203, 104, 1)";
        ctx.font = "small-caps bold 14px Helvetica";
        ctx.fillText("press ARROW KEYS to START...", 24, 374);
      }

      ctx.fillStyle = "white";
      ctx.font = "bold small-caps 16px Helvetica";
      ctx.fillText("points: " + points, 288, 40);
      ctx.fillText("top: " + pointsMax, 292, 60);

      return reward;
    },
  };

  function keyPush(evt) {
    switch (evt.keyCode) {
      case 37: //left
        game.action.left();
        evt.preventDefault();
        break;

      case 38: //up
        game.action.up();
        evt.preventDefault();
        break;

      case 39: //right
        game.action.right();
        evt.preventDefault();
        break;

      case 40: //down
        game.action.down();
        evt.preventDefault();
        break;

      case 32: //space
        Snake.pause();
        evt.preventDefault();
        break;

      case 27: //esc
        game.reset();
        evt.preventDefault();
        break;
    }
  }

  return {
    start: function (fps = 15) {
      setup();
      intervalID = setInterval(game.loop, 1000 / fps);
    },
    loop: game.loop,

    reset: game.reset,

    stop: function () {
      //clearInterval(intervalID);
    },

    setup: {
      keyboard: function (state) {
        if (state) {
          document.addEventListener("keydown", keyPush);
        } else {
          document.removeEventListener("keydown", keyPush);
        }
      },
      wall: function (state) {
        walls = state;
      },
      tileCount: function (size) {
        tileCount = size;
        gridSize = 400 / tileCount;
      },
      fixedTail: function (state) {
        fixedTail = state;
      },
    },

    action: function (act) {
      switch (act) {
        case "left":
          game.action.left();
          break;

        case "up":
          game.action.up();
          break;

        case "right":
          game.action.right();
          break;

        case "down":
          game.action.down();
          break;
      }
    },

    pause: function pause() {
      velocity.x = 0;
      velocity.y = 0;
    },

    clearTopScore: function () {
      pointsMax = 0;
    },

    data: {
      player: player,
      fruit: fruit,
      trail: function () {
        return trail;
      },
    },

    info: {
      tileCount: tileCount,
    },
    startbut: function () {
      //ajout
      color = getRandomColor();
    },
    middlebut: function () {
      color2 = getRandomColor();
    },
  };
})();

Snake.start(8);
Snake.setup.keyboard(true);
Snake.setup.fixedTail(false);
//rajout
</script>

</body>
</html>
