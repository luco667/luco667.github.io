<script>
/* ════════════════════════════════════════
   MATRIX
════════════════════════════════════════ */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

const CHARS =
'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';

let fontSize = 14;
let cols = 0;
let drops = [];

function initMatrix() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  cols = Math.floor(canvas.width / fontSize);

  drops = [];

  for (let i = 0; i < cols; i++) {
    drops[i] = Math.random() * -100;
  }
}

function drawMatrix() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = `${fontSize}px "Share Tech Mono", monospace`;

  for (let i = 0; i < drops.length; i++) {

    const text =
      CHARS[Math.floor(Math.random() * CHARS.length)];

    const y = drops[i] * fontSize;

    ctx.fillStyle = '#00ff41';

    ctx.fillText(text, i * fontSize, y);

    if (y > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }

    drops[i] += 0.5;
  }
}

initMatrix();

window.addEventListener('resize', initMatrix);

setInterval(drawMatrix, 40);


/* ════════════════════════════════════════
   TERMINAL
════════════════════════════════════════ */
const LINES = [
  '> initializing profile...',
  '> first name : Lucas',
  '> surname    : Le Gueut',
  '> status     : cybersecurity & electronics student',
  '> location   : France',
  '> interests  : design, networks, offensive security, embedded systems',
  '> education  : French National Brevet · STI2D Graduate',
  '> activities : PCB design · programming · networking',
  ' ',
  '> system ready_'
];

const output = document.getElementById('terminal-output');

let lineIndex = 0;
let charIndex = 0;

function typeLine() {

  if (lineIndex >= LINES.length) {

    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    output.appendChild(cursor);

    return;
  }

  const currentLine = LINES[lineIndex];

  if (charIndex < currentLine.length) {

    output.innerHTML =
      LINES.slice(0, lineIndex).join('<br>') +
      '<br>' +
      currentLine.substring(0, charIndex + 1);

    charIndex++;

    setTimeout(typeLine, 20);

  } else {

    lineIndex++;
    charIndex = 0;

    setTimeout(typeLine, 100);
  }
}

setTimeout(typeLine, 500);


/* ════════════════════════════════════════
   ACTIVE NAV
════════════════════════════════════════ */
const sections = document.querySelectorAll('section');
const navLinks = document.querySelectorAll('nav a');

window.addEventListener('scroll', () => {

  let current = '';

  sections.forEach(section => {

    if (window.scrollY >= section.offsetTop - 140) {
      current = section.id;
    }
  });

  navLinks.forEach(link => {

    link.classList.toggle(
      'active',
      link.getAttribute('href') === '#' + current
    );
  });
});


/* ════════════════════════════════════════
   PROJECTS
════════════════════════════════════════ */
const PROJECTS = [

    category: 'development',

    color: '#00ff41',

    projects: [

        name: 'Snake game',

        status: 'wip',
        date: '2025'

        tags: ['C', 'SDL3'],

    ]

      }

];

(function renderProjects() {

  const section = document.querySelector('#projects');

  const wrapper = document.createElement('div');
  wrapper.className = 'projects-grid';

  PROJECTS.forEach(category => {

    const card = document.createElement('div');

    card.className = 'project-card';

    card.innerHTML = `
      <div class="project-icon">${category.icon}</div>
      <div class="project-name">${category.category}</div>
      <div class="project-count">
        ${category.projects.length} projects
      </div>
    `;

    wrapper.appendChild(card);
  });

  section.appendChild(wrapper);

})();
</script>
