<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Lucas Le Gueut — Portfolio</title>

  <style>

/* ─────────────────────────────────────────
   FONTS
───────────────────────────────────────── */


@font-face {
  font-family: 'Share Tech Mono';
  src: url('ShareTechMono-Regular.ttf') format('truetype');
  font-display: swap;
  font-weight: 400;
  font-style: normal;
}

/* fallback VT323 */
@font-face {
  font-family: 'VT323';
  src: local('Courier New'), local('monospace');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

/* ─────────────────────────────────────────
   ROOT
───────────────────────────────────────── */

:root {
  --green: #00ff41;
  --green-dim: #00cc33;
  --green-dark: #003b00;

  --green-glow: rgba(0, 255, 65, 0.15);

  --bg: #000000;

  --card-bg: rgba(0, 10, 0, 0.85);

  --border: rgba(0, 255, 65, 0.3);
}

/* ─────────────────────────────────────────
   RESET
───────────────────────────────────────── */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--green);

  font-family: 'Share Tech Mono', monospace;

  overflow-x: hidden;
  background:#000;
  cursor: crosshair;
}

/* ─────────────────────────────────────────
   MATRIX
───────────────────────────────────────── */

#matrix{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;
  top: 0;
  left: 0;
  z-index:0;

  pointer-events:none;

  opacity:.45;
}
/* ─────────────────────────────────────────
   PROJECTS GRID
───────────────────────────────────────── */

.projects-grid{
  display:flex;
  gap:18px;

  overflow-x:auto;

  padding-bottom:10px;

  scrollbar-width:none;
}

.projects-grid::-webkit-scrollbar{
  display:none;
}

.project-card{
  flex-shrink:0;

  width:230px;

  padding:20px;

  border:1px solid var(--border);

  background:rgba(0,10,0,.8);

  cursor:pointer;

  transition:.22s;
}

.project-card:hover{
  transform:translateY(-4px);

  border-color:var(--green);

  box-shadow:0 0 22px rgba(0,255,65,.2);
}

.project-icon{
  font-size:2rem;

  margin-bottom:12px;
}

.project-name{
  font-size:1rem;

  margin-bottom:8px;

  letter-spacing:.08em;
}

.project-count{
  color:#666;

  font-size:.78rem;
}


/* ─────────────────────────────────────────
   LAYOUT
───────────────────────────────────────── */

header,
nav,
section,
footer {
  position: relative;
  z-index: 10;
}

/* ─────────────────────────────────────────
   HEADER
───────────────────────────────────────── */

header {
  text-align: center;

  padding:90px 20px 50px;
}

header h1 {
  font-family: 'VT323', monospace;

  font-size: clamp(2.5rem, 7vw, 5rem);

  color: var(--green);

  letter-spacing: 0.08em;

  text-shadow:
    0 0 10px var(--green),
    0 0 30px var(--green),
    0 0 60px var(--green-dim);

  animation: flicker 6s infinite;
}

header .subtitle {
  margin-top: 10px;

  color: var(--green-dim);

  font-size: 0.9rem;

  opacity: 0.8;

  letter-spacing: 0.15em;
}

header .subtitle::before {
  content: '> ';
  opacity: 0.5;
}

/* ─────────────────────────────────────────
   NAVBAR
───────────────────────────────────────── */

nav {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  gap: 14px;

  width: 100%;

  padding: 14px 18px;

  overflow-x: auto;
  overflow-y: hidden;

  white-space: nowrap;

  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);

  background: rgba(0, 0, 0, 0.72);

  backdrop-filter: blur(10px);

  scrollbar-width: none;
}

nav::-webkit-scrollbar {
  display: none;
}

nav a {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  padding: 10px 14px;

  border: 1px solid transparent;

  color: var(--green-dim);

  text-decoration: none;
  text-transform: lowercase;

  font-size: 0.82rem;

  letter-spacing: 0.12em;

  transition:
    color 0.2s ease,
    border-color 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

nav a::before {
  content: '[ ';
  opacity: 0;
  transition: opacity 0.2s;
}

nav a::after {
  content: ' ]';
  opacity: 0;
  transition: opacity 0.2s;
}

nav a:hover {
  color: var(--green);

  text-shadow:
    0 0 6px var(--green),
    0 0 12px var(--green);
}

nav a:hover::before,
nav a:hover::after {
  opacity: 1;
}

/* ACTIVE LINK */

nav a.active {
  color: var(--green);

  border-color: var(--green);

  background: rgba(0,255,65,0.08);

  text-shadow:
    0 0 6px var(--green),
    0 0 12px var(--green);

  box-shadow:
    0 0 10px rgba(0,255,65,0.15),
    inset 0 0 10px rgba(0,255,65,0.04);
}

nav a.active::before,
nav a.active::after {
  opacity: 1;
}

/* ─────────────────────────────────────────
   SECTIONS
───────────────────────────────────────── */

section {
  max-width: 860px;

  margin: 0 auto;

  padding: 70px 20px;
}

section h2 {
  margin-bottom: 30px;

  font-family: 'VT323', monospace;

  font-size: 2rem;

  color: var(--green);

  letter-spacing: 0.1em;

  text-shadow: 0 0 12px var(--green);
}


/* ─────────────────────────────────────────
   CARDS
───────────────────────────────────────── */

.card {
  background: var(--card-bg);

  border: 1px solid var(--border);

  border-radius: 2px;

  padding: 28px 32px;

  backdrop-filter: blur(6px);

  box-shadow:
    0 0 20px rgba(0,255,65,0.05),
    inset 0 0 40px rgba(0,255,65,0.02);
}

.card p {
  color: var(--green-dim);

  font-size: 0.92rem;

  line-height: 1.9;
}

.card p:hover {
  color: var(--green);

  text-shadow: 0 0 6px var(--green);

  transition: all 0.2s;
}
/* ─────────────────────────────────────────
   TERMINAL
───────────────────────────────────────── */

.terminal{
  position:relative;

  overflow:hidden;
}

.terminal::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,.09) 3px,
      rgba(0,0,0,.09) 4px
    );

  pointer-events:none;
}

#terminal-output{
  position:relative;

  z-index:2;

  min-height:180px;

  color:var(--green-dim);

  line-height:1.9;

  white-space:pre-wrap;
}

.cursor{
  display:inline-block;

  width:8px;
  height:1em;

  margin-left:3px;

  background:var(--green);

  animation:blink 1s infinite;
}

/* ─────────────────────────────────────────
   SKILLS
───────────────────────────────────────── */

.skills {
  display: flex;
  flex-wrap: wrap;

  gap: 12px;

  padding: 24px;
}

.skills span {
  padding: 6px 18px;

  border: 1px solid var(--border);

  background: rgba(0,255,65,0.03);

  color: var(--green-dim);

  font-size: 0.85rem;

  letter-spacing: 0.12em;

  cursor: default;

  transition: all 0.2s;
}

.skills span:hover {
  color: var(--green);

  border-color: var(--green);

  background: rgba(0,255,65,0.07);

  text-shadow: 0 0 8px var(--green);

  box-shadow: 0 0 12px rgba(0,255,65,0.15);

  transform:translateY(-2px);
}

.skills a{
  color:inherit;
  text-decoration:none;
}

/* ─────────────────────────────────────────
   PROJECTS
───────────────────────────────────────── */

#projects .card {
  margin-bottom: 16px;
}

/* ─────────────────────────────────────────
   FOOTER
───────────────────────────────────────── */

footer {
  padding: 30px;

  border-top: 1px solid var(--border);

  text-align: center;

  color: var(--green-dark);

  font-size: 0.8rem;

  letter-spacing: 0.15em;
}

/* ─────────────────────────────────────────
   ANIMATIONS
───────────────────────────────────────── */

@keyframes blink {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: 0;
  }
}

@keyframes flicker {
  0%, 95%, 100% {
    opacity: 1;
  }

  96% {
    opacity: 0.7;
  }

  97% {
    opacity: 1;
  }

  98% {
    opacity: 0.6;
  }

  99% {
    opacity: 1;
  }
}

/* ─────────────────────────────────────────
   SCROLLBAR
───────────────────────────────────────── */

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: #000;
}

::-webkit-scrollbar-thumb {
  background: var(--green-dark);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--green-dim);
}

/* ─────────────────────────────────────────
   SELECTION
───────────────────────────────────────── */

::selection {
  background: var(--green);
  color: #000;
}
/* ─────────────────────────────────────────
   GLOBAL
───────────────────────────────────────── */

header,
nav,
section,
footer{
  position:relative;
  z-index:10;
}

section{
  width:min(950px, calc(100% - 30px));

  margin:auto;

  padding:80px 0;
}

section h2{
  margin-bottom:25px;

  font-size:2rem;

  letter-spacing:.12em;

  text-shadow:0 0 10px var(--green);
}
/* ─────────────────────────────────────────
   MODAL
───────────────────────────────────────── */

#overlay{
  position:fixed;
  inset:0;

  z-index:1000;

  display:flex;
  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.84);

  backdrop-filter:blur(10px);

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

#overlay.open{
  opacity:1;
  pointer-events:all;
}

.modal{
  width:min(760px, 92vw);

  max-height:84vh;

  overflow-y:auto;

  background:#020d02;

  border:1px solid var(--green);

  padding:28px;

  box-shadow:0 0 40px rgba(0,255,65,.18);

  transform:translateY(14px);

  transition:.25s;
}

#overlay.open .modal{
  transform:translateY(0);
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:22px;
}

.modal-title{
  font-size:1.4rem;

  letter-spacing:.1em;

  text-shadow:0 0 10px var(--green);
}

.close{
  width:34px;
  height:34px;

  border:1px solid var(--border);

  background:none;

  color:var(--green);

  cursor:pointer;

  font-size:1rem;
}

.close:hover{
  border-color:var(--green);
}

.project-item{
  margin-bottom:16px;

  padding:18px;

  border:1px solid rgba(255,255,255,.06);

  background:rgba(255,255,255,.02);
}

.project-item:hover{
  border-color:rgba(0,255,65,.3);
}

.project-item-top{
  display:flex;
  justify-content:space-between;
  gap:12px;

  margin-bottom:10px;
}

.project-item-name a{
  color:var(--green);

  text-decoration:none;
}

.project-item-name a:hover{
  text-decoration:underline;
}

.project-desc{
  color:#6e8f6e;

  line-height:1.7;

  margin-bottom:12px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.tag{
  padding:4px 8px;

  border:1px solid #173617;

  color:#5d815d;

  font-size:.72rem;
}



/* ─────────────────────────────────────────
   TABLET
───────────────────────────────────────── */

@media screen and (max-width: 900px) {

  header {
    padding: 60px 20px 30px;
  }

  section {
    padding: 60px 18px;
  }

  .card,
  .terminal {
    padding: 22px;
  }

}

/* ─────────────────────────────────────────
   MOBILE
───────────────────────────────────────── */
/* ─────────────────────────────────────────
   MOBILE
───────────────────────────────────────── */

@media screen and (max-width: 768px) {

  body {
    cursor: default;
  }

  header {
    padding: 50px 15px 25px;
  }

  header h1 {
    font-size: clamp(2rem, 12vw, 3.5rem);

    line-height: 1;

    word-break: break-word;
  }

  header .subtitle {
    padding: 0 10px;

    font-size: 0.75rem;

    line-height: 1.6;

    letter-spacing: 0.08em;
  }

  nav {
    gap: 10px;

    padding: 12px;

    scroll-padding-left: 12px;
  }

  nav a {
    padding: 9px 12px;

    font-size: 0.74rem;

    letter-spacing: 0.08em;
  }

  section {
    padding: 45px 14px;
  }

  section h2 {
    margin-bottom: 20px;

    font-size: 1.6rem;
  }

  .card,
  .terminal {
    padding: 18px;
  }

  .card p,
  #terminal-output {
    font-size: 0.82rem;

    line-height: 1.7;
  }

  .skills {
    justify-content: center;

    gap: 10px;

    padding: 18px;
  }

  .skills span {
    padding: 6px 12px;

    font-size: 0.75rem;
  }

  footer {
    padding: 20px 10px;

    font-size: 0.7rem;
  }

  #matrix {
    opacity: 0.3;
  }

}

/* ─────────────────────────────────────────
   SMALL PHONES
───────────────────────────────────────── */

@media screen and (max-width: 480px) {

  header {
    padding-top: 40px;
  }

  header h1 {
    font-size: 2rem;
  }

  header .subtitle {
    margin-top: 8px;

    font-size: 0.68rem;
  }

  section {
    padding: 38px 12px;
  }

  section h2 {
    font-size: 1.4rem;
  }

  .card,
  .terminal {
    padding: 16px;
  }

  .card p,
  #terminal-output {
    font-size: 0.76rem;

    line-height: 1.6;
  }

  .skills {
    flex-direction: row;

    align-items: stretch;
  }

  .skills span {
    width: 100%;

    text-align: center;
  }

  footer {
    letter-spacing: 0.08em;
  }

}

/* ─────────────────────────────────────────
   VERY SMALL DEVICES
───────────────────────────────────────── */

@media screen and (max-width: 340px) {

  header h1 {
    font-size: 1.6rem;
  }

  nav a {
    font-size: 0.7rem;
  }

  .card p,
  #terminal-output {
    font-size: 0.72rem;
  }

}
  
  </style>

<canvas id="matrix"></canvas>

<header>

      >

    </p>

  </div>

</section>

</footer>

<div id="overlay">

  <div class="modal">

      </button>

  </div>

</div>

<script>

/* ─────────────────────────────────────────
   MATRIX
───────────────────────────────────────── */

const canvas = document.getElementById('matrix');

const ctx = canvas.getContext('2d');

const chars =
'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF';

let fontSize = 14;
let columns;
let drops = [];

function initMatrix(){

  canvas.width = innerWidth;
  canvas.height = innerHeight;

  columns = Math.floor(canvas.width / fontSize);

  drops = [];

  for(let i=0;i<columns;i++){
    drops[i] = Math.random() * -100;
  }
}

function drawMatrix(){

  ctx.fillStyle = 'rgba(0,0,0,.05)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font = `${fontSize}px Share Tech Mono`;

  for(let i=0;i<drops.length;i++){

    const text =
      chars[Math.floor(Math.random()*chars.length)];

    const y = drops[i] * fontSize;

    ctx.fillStyle = '#00ff41';

    ctx.fillText(text, i * fontSize, y);

    if(y > canvas.height && Math.random() > .975){
      drops[i] = 0;
    }

    drops[i] += .5;
  }
}

initMatrix();

addEventListener('resize', initMatrix);

setInterval(drawMatrix, 40);

/* ─────────────────────────────────────────
   TERMINAL
───────────────────────────────────────── */

const lines = [
  '> initializing profile...',
  '> first name : Lucas',
  '> surname    : Le Gueut',
  '> status     : cybersecurity & electronics student',
  '> location   : France',
  '> interests  : design, networks, offensive security',
  '> education  : STI2D Graduate · BTS CIEL Option B',
  '> activities : PCB design · programming · networking',
  ' ',
  '> system ready_'
];

const output =
  document.getElementById('terminal-output');

let lineIndex = 0;
let charIndex = 0;

function renderTerminal(){

  let html = '';

  for(let i=0;i<lineIndex;i++){
    html += lines[i] + '<br>';
  }

  if(lineIndex < lines.length){
    html += lines[lineIndex].slice(0, charIndex);
  }

  output.innerHTML = html;
}

function typeTerminal(){

  if(lineIndex >= lines.length){

    const cursor = document.createElement('span');

    cursor.className = 'cursor';

    output.appendChild(cursor);

    return;
  }

  const currentLine = lines[lineIndex];

  if(charIndex < currentLine.length){

    charIndex++;

    renderTerminal();

    setTimeout(
      typeTerminal,
      Math.random()*35 + 18
    );

  }else{

    lineIndex++;
    charIndex = 0;

    renderTerminal();

    setTimeout(typeTerminal, 110);
  }
}

setTimeout(typeTerminal, 600);

/* ─────────────────────────────────────────
   ACTIVE NAV
───────────────────────────────────────── */

const sections =
  document.querySelectorAll('section');

const navLinks =
  document.querySelectorAll('nav a');

addEventListener('scroll', ()=>{

  let current = '';

  sections.forEach(section=>{

    if(scrollY >= section.offsetTop - 140){
      current = section.id;
    }
  });

  navLinks.forEach(link=>{

    link.classList.toggle(
      'active',
      link.getAttribute('href') === `#${current}`
    );
  });

}, { passive:true });

/* ─────────────────────────────────────────
   PROJECTS
───────────────────────────────────────── */

const PROJECTS = [

  {
    category:'development',
    icon:'▸',

    projects:[
      {
        name:'Snake game',

        desc:'Jeu Snake en Javascript.',

        tags:['javascript','html','css'],

        link:'Projects/snake/enregistrement/snake.html'
      },

      {
        name:'Notepad',

        desc:'Bloc-notes développé en C.',

        tags:['C','SDL3'],

        link:'https://github.com/luco667/LANGUAGEC'
      }
    ]
  },

  {
    category:'electronics',
    icon:'◈',

    projects:[
      {
        name:'PCB KiCad',

        desc:'Conception PCB sous KiCad.',

        tags:['KiCad','PCB']
      }
    ]
  },

  {
    category:'network',
    icon:'⬢',

    projects:[
      {
        name:'Proxy',

        desc:'Routeur proxy anti-pub.',

        tags:['network','proxy']
      }
    ]
  }
];

const projectsSection =
  document.querySelector('#projects');

const grid =
  document.createElement('div');

grid.className = 'projects-grid';

PROJECTS.forEach(category=>{

  const card =
    document.createElement('div');

  card.className = 'project-card';

  card.innerHTML = `
    <div class="project-icon">
      ${category.icon}
    </div>

    <div class="project-name">
      ./${category.category}/
    </div>

    <div class="project-count">
      ${category.projects.length} projects
    </div>
  `;

  card.addEventListener('click', ()=>{

    openCategory(category);
  });

  grid.appendChild(card);
});

projectsSection.appendChild(grid);

/* ─────────────────────────────────────────
   MODAL
───────────────────────────────────────── */

const overlay =
  document.getElementById('overlay');

const modalTitle =
  document.getElementById('modal-title');

const modalContent =
  document.getElementById('modal-content');

document
  .getElementById('close')
  .addEventListener('click', closeModal);

overlay.addEventListener('click', e=>{

  if(e.target === overlay){
    closeModal();
  }
});

addEventListener('keydown', e=>{

  if(e.key === 'Escape'){
    closeModal();
  }
});

function openCategory(category){

  modalTitle.textContent =
    `> ${category.category}/`;

  modalContent.innerHTML = '';

  category.projects.forEach(project=>{

    const item =
      document.createElement('div');

    item.className = 'project-item';

    const tags =
      project.tags
        .map(tag=>`<span class="tag">#${tag}</span>`)
        .join('');

    const title =
      project.link
        ? `
          <a
            href="${project.link}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${project.name}
          </a>
        `
        : project.name;

    item.innerHTML = `
      <div class="project-item-top">

        <div class="project-item-name">
          ${title}
        </div>

      </div>

      <div class="project-desc">
        ${project.desc}
      </div>

      <div class="tags">
        ${tags}
      </div>
    `;

    modalContent.appendChild(item);
  });

  overlay.classList.add('open');

  document.body.style.overflow = 'hidden';
}

function closeModal(){

  overlay.classList.remove('open');

  document.body.style.overflow = '';
}

</script>

</body>
</html>
